[build-system]
# PEP 639 metadata (the SPDX "license" string and "license-files") needs
# setuptools 77 or later. Version 76 fails to generate the metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-diagnostics"
description = "Cost and prompt-cache diagnostics for Claude Code session transcripts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kezia Cousins" }]
keywords = ["claude", "claude-code", "prompt-cache", "cost", "diagnostics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
csd = "csd.cli:main"

[project.urls]
Homepage = "https://github.com/keziacousins/claude-session-diagnostics"
Source = "https://github.com/keziacousins/claude-session-diagnostics"
Issues = "https://github.com/keziacousins/claude-session-diagnostics/issues"

[tool.setuptools]
packages = ["csd"]

[tool.setuptools.dynamic]
version = { attr = "csd.__version__" }
