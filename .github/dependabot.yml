version: 2

updates:
  # The tool has no Python dependencies. The only supply chain is the set of
  # GitHub Actions used by the workflows, which are pinned to commit SHAs.
  # Dependabot moves those pins forward when a new version is released.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
