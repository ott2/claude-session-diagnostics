name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. This workflow only reads the code; it never writes to the
# repository. A pull request from a fork gets a read-only token and no secrets.
permissions:
  contents: read

# A new push to the same branch cancels the previous run, so a rapid series of
# pushes cannot occupy the runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to a commit SHA. A tag can be moved to point at
      # different code; a SHA cannot.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The tool has no dependencies, so there is nothing to install.
      - name: Run the test suite
        run: python -m unittest discover -s tests

  package:
    name: package installs and the console script runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # This step builds the code in the pull request, which runs the build
      # backend. The token is read-only and no secrets are present, so the
      # result cannot reach the repository.
      - name: Install the package
        run: python -m pip install .

      - name: Check the console script
        run: csd --help
