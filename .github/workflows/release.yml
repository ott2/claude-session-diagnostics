name: release

# A published GitHub Release starts this workflow. Nothing else does. There is
# no manual trigger, so a person cannot publish a build that has no release.
on:
  release:
    types: [published]

# Least privilege at the top level. Only the publish job asks for more.
permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA. A tag can be moved to point at
      # different code; a SHA cannot.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The release tag must agree with the version in the code. If the two
      # disagree, the run stops here and PyPI receives nothing.
      - name: Check the tag against the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import csd; print(csd.__version__)')
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is $TAG. The version is $version. They must agree."
            exit 1
          fi
          echo "The tag and the version agree: $TAG"

      - name: Run the test suite
        run: python -m unittest discover -s tests

      - name: Build the source distribution and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Keep the distributions for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The environment holds the rule for who can publish. Add a required
    # reviewer there to make each release wait for approval.
    environment:
      name: pypi
      url: https://pypi.org/p/claude-session-diagnostics

    # PyPI trusted publishing reads this short-lived OIDC token. The repository
    # holds no API token. This job does not build the code, so a build step
    # cannot reach the token.
    permissions:
      id-token: write

    steps:
      - name: Get the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
